<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LAB-FINAL-PREP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="background: transparent;">

<div class="login-wrapper">
    <div class="login-card">
        <div style="text-align: center; margin-bottom: 16px;">
            <span class="brand-badge">LAB-FINAL-PREP</span>
        </div>
        <h1 class="login-title">Welcome Back</h1>
        <p class="login-subtitle">Sign in to access the Enterprise Management Portal</p>

        <div th:if="${param.error}" class="alert alert-danger">
            Invalid username or password. Please try again.
        </div>

        <div th:if="${param.logout}" class="alert alert-success">
            You have been logged out successfully.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group" style="margin-bottom: 18px;">
                <label class="form-label" for="username">Username</label>
                <input class="form-input" type="text" id="username" name="username" required autofocus placeholder="Enter your username">
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label class="form-label" for="password">Password</label>
                <input class="form-input" type="password" id="password" name="password" required placeholder="Enter your password">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1rem;">
                Sign In
            </button>
        </form>

        <div class="demo-box">
            <strong>Default Credentials:</strong><br>
            &bull; Admin Role: <code>admin</code> / <code>admin123</code><br>
            &bull; User Role: <code>student1</code> / <code>user123</code>
        </div>
    </div>
</div>

</body>
</html>
