<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Zone Pickups - Employee Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-5">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-box-arrow-in-down me-2 text-success"></i>Pending Zone Pickups</h2>
        <span class="badge bg-secondary fs-6">Zone: <span th:text="${employee.assignedZone}">Zone Name</span></span>
    </div>

    <div class="card border-0 shadow-sm rounded-3">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-success">
                <tr>
                    <th>Tracking ID</th>
                    <th>Sender Name</th>
                    <th>Pickup Address</th>
                    <th>City & Zone</th>
                    <th>Weight</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${pickups}">
                    <td><strong th:text="${p.trackingNumber}">TRK-12345678</strong></td>
                    <td th:text="${p.sender.fullName}">Sender Name</td>
                    <td th:text="${p.pickupAddress.streetAddress}">Street Address</td>
                    <td><span th:text="${p.pickupAddress.city}">City</span> (<span th:text="${p.pickupAddress.zone}">Zone</span>)</td>
                    <td><span th:text="${p.weightKg}">1.0</span> kg</td>
                    <td>
                        <form th:action="@{/employee/claim-pickup}" method="post">
                            <input type="hidden" name="courierId" th:value="${p.id}"/>
                            <button type="submit" class="btn btn-sm btn-success fw-bold"><i class="bi bi-check2-circle me-1"></i>Claim Pickup</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(pickups)}">
                    <td colspan="6" class="text-center py-4 text-muted">No pending pickups available in your assigned zone right now.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
