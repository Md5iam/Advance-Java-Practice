<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Courier - CourierExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card shadow-lg border-0 rounded-4 p-4">
                <h3 class="fw-bold mb-4 text-primary"><i class="bi bi-box-seam me-2"></i>Book a New Courier Shipment</h3>

                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <form th:action="@{/user/book}" method="post" th:object="${bookingDto}">
                    <div class="row g-4">
                        <!-- Receiver Info -->
                        <div class="col-md-12">
                            <h5 class="border-bottom pb-2 text-dark"><i class="bi bi-person me-2"></i>Receiver Details</h5>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Receiver Full Name</label>
                            <input type="text" th:field="*{receiverName}" class="form-control" placeholder="Receiver Name" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('receiverName')}" th:errors="*{receiverName}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Receiver Phone Number</label>
                            <input type="text" th:field="*{receiverPhone}" class="form-control" placeholder="017XXXXXXXX" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('receiverPhone')}" th:errors="*{receiverPhone}"></div>
                        </div>

                        <!-- Pickup Address -->
                        <div class="col-md-12 mt-4">
                            <h5 class="border-bottom pb-2 text-dark"><i class="bi bi-geo-alt me-2"></i>Pickup Address (Sender Location)</h5>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Street Address</label>
                            <input type="text" th:field="*{senderStreet}" class="form-control" placeholder="House 12, Road 4" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">City</label>
                            <input type="text" th:field="*{senderCity}" class="form-control" placeholder="Dhaka" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Zone</label>
                            <select th:field="*{senderZone}" class="form-select" required>
                                <option value="Dhaka North">Dhaka North</option>
                                <option value="Dhaka South">Dhaka South</option>
                                <option value="Chittagong Central">Chittagong Central</option>
                                <option value="Uttara Zone">Uttara Zone</option>
                                <option value="Dhanmondi Zone">Dhanmondi Zone</option>
                                <option value="Mirpur Zone">Mirpur Zone</option>
                            </select>
                        </div>

                        <!-- Delivery Address -->
                        <div class="col-md-12 mt-4">
                            <h5 class="border-bottom pb-2 text-dark"><i class="bi bi-truck me-2"></i>Delivery Destination Address</h5>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Street Address</label>
                            <input type="text" th:field="*{receiverStreet}" class="form-control" placeholder="Destination Street" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">City</label>
                            <input type="text" th:field="*{receiverCity}" class="form-control" placeholder="City Name" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Zone</label>
                            <select th:field="*{receiverZone}" class="form-select" required>
                                <option value="Dhaka North">Dhaka North</option>
                                <option value="Dhaka South">Dhaka South</option>
                                <option value="Chittagong Central">Chittagong Central</option>
                                <option value="Uttara Zone">Uttara Zone</option>
                                <option value="Dhanmondi Zone">Dhanmondi Zone</option>
                                <option value="Mirpur Zone">Mirpur Zone</option>
                            </select>
                        </div>

                        <!-- Parcel Specifications -->
                        <div class="col-md-12 mt-4">
                            <h5 class="border-bottom pb-2 text-dark"><i class="bi bi-box me-2"></i>Parcel Specifications & Cash-On-Delivery</h5>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Package Weight (KG)</label>
                            <input type="number" step="0.1" th:field="*{weightKg}" class="form-control" placeholder="e.g. 1.5" required>
                            <div class="text-muted small mt-1">Pricing: Base fee BDT 60 + BDT 25/kg</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Collect Cash Amount on Delivery (COD BDT)</label>
                            <input type="number" step="1" th:field="*{collectAmount}" class="form-control" placeholder="0 if prepaid">
                        </div>
                    </div>

                    <div class="mt-4 text-end">
                        <a th:href="@{/user/dashboard}" class="btn btn-outline-secondary btn-lg me-2">Cancel</a>
                        <button type="submit" class="btn btn-primary btn-lg fw-bold px-5">Submit Booking</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
