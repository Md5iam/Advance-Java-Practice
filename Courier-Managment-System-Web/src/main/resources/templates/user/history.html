<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Shipment History - CourierExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-5">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold"><i class="bi bi-clock-history me-2 text-primary"></i>My Shipment History</h2>
        <a th:href="@{/user/book}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>New Booking</a>
    </div>

    <div class="card border-0 shadow-sm rounded-3">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Tracking ID</th>
                    <th>Receiver Name</th>
                    <th>Receiver Phone</th>
                    <th>Destination Zone</th>
                    <th>Weight</th>
                    <th>Delivery Fee</th>
                    <th>COD Amount</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${couriers}">
                    <td><strong class="text-primary" th:text="${c.trackingNumber}">TRK-12345678</strong></td>
                    <td th:text="${c.receiverName}">Receiver</td>
                    <td th:text="${c.receiverPhone}">017XXXXXXXX</td>
                    <td th:text="${c.deliveryAddress.zone}">Zone</td>
                    <td><span th:text="${c.weightKg}"></span> kg</td>
                    <td>BDT <span th:text="${c.totalFee}"></span></td>
                    <td>BDT <span th:text="${c.collectAmount}"></span></td>
                    <td>
                        <span class="badge" 
                              th:classappend="${c.status.name() == 'DELIVERED' ? 'bg-success' : (c.status.name() == 'CANCELLED' ? 'bg-danger' : 'bg-warning text-dark')}"
                              th:text="${c.status}">PENDING</span>
                    </td>
                    <td>
                        <a th:href="@{'/user/invoice/' + ${c.id}}" class="btn btn-sm btn-outline-secondary me-1"><i class="bi bi-file-text"></i> Invoice</a>
                        <a th:if="${c.status.name() == 'PENDING'}" th:href="@{'/user/cancel/' + ${c.id}}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure you want to cancel this booking?')">Cancel</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(couriers)}">
                    <td colspan="9" class="text-center py-4 text-muted">No courier history found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
