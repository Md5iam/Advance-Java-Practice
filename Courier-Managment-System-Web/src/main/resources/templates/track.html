<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Track Shipment - CourierExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0 p-4 mb-4">
                <h2 class="card-title text-center mb-4"><i class="bi bi-search text-primary me-2"></i>Track Your Shipment</h2>
                <form th:action="@{/track}" method="post" th:object="${trackingDto}">
                    <div class="input-group input-group-lg mb-3">
                        <input type="text" th:field="*{trackingNumber}" class="form-control" placeholder="Enter Tracking Number (e.g., TRK-XXXXXXXX)" required>
                        <button class="btn btn-primary px-4" type="submit">Search</button>
                    </div>
                    <div th:if="${#fields.hasErrors('trackingNumber')}" class="text-danger small" th:errors="*{trackingNumber}"></div>
                </form>
            </div>

            <!-- Error message if not found -->
            <div th:if="${error}" class="alert alert-warning text-center shadow-sm">
                <i class="bi bi-exclamation-circle-fill me-2"></i><span th:text="${error}"></span>
            </div>

            <!-- Tracking Details Result -->
            <div th:if="${courier}" class="card shadow-lg border-0">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                    <h5 class="mb-0">Shipment Details: <span class="text-warning" th:text="${courier.trackingNumber}"></span></h5>
                    <span class="badge fs-6" 
                          th:classappend="${courier.status.name() == 'DELIVERED' ? 'bg-success' : (courier.status.name() == 'CANCELLED' ? 'bg-danger' : 'bg-info')}"
                          th:text="${courier.status}">STATUS</span>
                </div>
                <div class="card-body p-4">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <h6 class="text-muted border-bottom pb-2"><i class="bi bi-person-up me-2"></i>Sender Information</h6>
                            <p class="mb-1"><strong>Name:</strong> <span th:text="${courier.sender.fullName}"></span></p>
                            <p class="mb-1"><strong>Pickup City:</strong> <span th:text="${courier.pickupAddress.city}"></span> (<span th:text="${courier.pickupAddress.zone}"></span>)</p>
                            <p class="mb-1"><strong>Street:</strong> <span th:text="${courier.pickupAddress.streetAddress}"></span></p>
                        </div>
                        <div class="col-md-6">
                            <h6 class="text-muted border-bottom pb-2"><i class="bi bi-person-down me-2"></i>Receiver Information</h6>
                            <p class="mb-1"><strong>Name:</strong> <span th:text="${courier.receiverName}"></span></p>
                            <p class="mb-1"><strong>Phone:</strong> <span th:text="${courier.receiverPhone}"></span></p>
                            <p class="mb-1"><strong>Delivery Address:</strong> <span th:text="${courier.deliveryAddress.streetAddress}"></span>, <span th:text="${courier.deliveryAddress.city}"></span></p>
                        </div>
                        <div class="col-12 mt-3">
                            <div class="p-3 bg-light rounded d-flex justify-content-between">
                                <div><strong>Weight:</strong> <span th:text="${courier.weightKg}"></span> kg</div>
                                <div><strong>Delivery Fee:</strong> BDT <span th:text="${courier.totalFee}"></span></div>
                                <div><strong>Cash Collection (COD):</strong> BDT <span th:text="${courier.collectAmount}"></span></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
