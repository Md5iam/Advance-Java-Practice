<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Staff Approvals - Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-5">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-person-check text-warning me-2"></i>Pending Staff Approvals</h2>
        <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary">Back to Dashboard</a>
    </div>

    <div class="card border-0 shadow-sm rounded-3">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-warning">
                <tr>
                    <th>Staff Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Assigned Coverage Zone</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="emp : ${pendingEmployees}">
                    <td><strong th:text="${emp.fullName}">Staff Name</strong></td>
                    <td th:text="${emp.email}">staff@courier.com</td>
                    <td th:text="${emp.phone}">017XXXXXXXX</td>
                    <td><span class="badge bg-primary" th:text="${emp.assignedZone}">Zone</span></td>
                    <td><span class="badge bg-secondary">Pending Approval</span></td>
                    <td>
                        <form th:action="@{/admin/approve-staff}" method="post">
                            <input type="hidden" name="employeeId" th:value="${emp.id}"/>
                            <button type="submit" class="btn btn-sm btn-success fw-bold"><i class="bi bi-check-lg me-1"></i>Approve Account</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(pendingEmployees)}">
                    <td colspan="6" class="text-center py-4 text-muted">No pending employee approval requests. All staff accounts are active!</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
