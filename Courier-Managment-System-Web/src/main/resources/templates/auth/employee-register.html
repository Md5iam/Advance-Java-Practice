<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Delivery Staff Registration - CourierExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0 rounded-4 p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-bicycle display-4 text-success"></i>
                    <h3 class="fw-bold mt-2">Delivery Staff Registration</h3>
                    <p class="text-muted small">Register as delivery staff. Requires Admin approval before sign-in.</p>
                </div>

                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <form th:action="@{/employee/register}" method="post" th:object="${userDto}">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" th:field="*{fullName}" class="form-control" placeholder="Staff Name" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" th:field="*{email}" class="form-control" placeholder="staff@courier.com" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="text" th:field="*{phone}" class="form-control" placeholder="017XXXXXXXX" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Assigned Delivery Zone</label>
                        <select th:field="*{assignedZone}" class="form-select" required>
                            <option value="">-- Select Coverage Zone --</option>
                            <option value="Dhaka North">Dhaka North</option>
                            <option value="Dhaka South">Dhaka South</option>
                            <option value="Chittagong Central">Chittagong Central</option>
                            <option value="Uttara Zone">Uttara Zone</option>
                            <option value="Dhanmondi Zone">Dhanmondi Zone</option>
                            <option value="Mirpur Zone">Mirpur Zone</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" th:field="*{password}" class="form-control" placeholder="At least 4 characters" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100 fw-bold mt-3">Submit Staff Application</button>
                </form>

                <div class="text-center mt-3 small">
                    Already registered? <a th:href="@{/login}" class="fw-bold text-decoration-none">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
