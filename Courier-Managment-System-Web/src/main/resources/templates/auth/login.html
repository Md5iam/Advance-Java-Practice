<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign In - CourierExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4 p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-box-seam display-4 text-primary"></i>
                    <h3 class="fw-bold mt-2">Sign In to Your Account</h3>
                    <p class="text-muted small">Enter your email and password to access dashboard</p>
                </div>

                <div th:replace="~{fragments/alerts :: alerts}"></div>
                <div th:if="${param.error}" class="alert alert-danger small">Invalid email or password. Or account pending admin approval.</div>
                <div th:if="${param.logout}" class="alert alert-info small">You have been logged out successfully.</div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label font-weight-bold">Email Address</label>
                        <input type="email" id="email" name="email" class="form-control form-control-lg" placeholder="name@example.com" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label font-weight-bold">Password</label>
                        <input type="password" id="password" name="password" class="form-control form-control-lg" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mt-3">Sign In</button>
                </form>

                <hr class="my-4">
                <div class="text-center small">
                    Don't have a customer account? <a th:href="@{/register}" class="fw-bold text-decoration-none">Sign Up</a><br>
                    Want to register as Delivery Staff? <a th:href="@{/employee/register}" class="fw-bold text-success text-decoration-none">Staff Registration</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
