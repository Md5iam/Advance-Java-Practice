<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header(${room.id == null ? 'Add Room' : 'Edit Room'})}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('rooms')}"></nav>

<div class="container">
    <div class="form-card">
        <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem;"
            th:text="${room.id == null ? 'Add New Room' : 'Edit Room #' + room.roomNumber}">Add New Room</h2>
        <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">Fill in the room details below</p>

        <form th:action="@{/rooms/save}" th:object="${room}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <label class="form-label" for="roomNumber">Room Number</label>
                <input type="text" id="roomNumber" th:field="*{roomNumber}" class="form-control" placeholder="e.g. 101, 202" required />
            </div>

            <div class="form-group">
                <label class="form-label" for="type">Room Type</label>
                <select id="type" th:field="*{type}" class="form-select" required>
                    <option th:each="rt : ${roomTypes}"
                            th:value="${rt}"
                            th:text="${rt.displayName}">Single Room</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="pricePerNight">Price per Night ($)</label>
                <input type="number" step="0.01" id="pricePerNight" th:field="*{pricePerNight}" class="form-control" placeholder="e.g. 99.99" required />
            </div>

            <div class="form-group">
                <label class="form-label" for="status">Room Status</label>
                <select id="status" th:field="*{status}" class="form-select" required>
                    <option th:each="rs : ${roomStatuses}"
                            th:value="${rs}"
                            th:text="${rs.displayName}">Available</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="description">Description</label>
                <textarea id="description" th:field="*{description}" class="form-control" rows="3" placeholder="Room features, view, bed configuration..."></textarea>
            </div>

            <div class="form-actions">
                <a href="/rooms" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Room</button>
            </div>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
