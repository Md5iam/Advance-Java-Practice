<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bus Fare Calculator</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <h1>Bus Fare Calculator</h1>

    <form method="post" th:action="@{/bus/calculate}" th:object="${fare}">

        <label>Starting Address</label>
        <input type="text" th:field="*{startAddress}"><br>
        <span th:errors="*{startAddress}" style="color: red"></span>
        <br><br>

        <label>Drop Address</label>
        <input type="text" th:field="*{dropAddress}"><br>
        <span th:errors="*{dropAddress}" style="color: red"></span>
        <br><br>

        <label>Distance (KM)</label>
        <input type="number" step="0.1" th:field="*{km}"><br>
        <span th:errors="*{km}" style="color: red"></span>
        <br><br>

        <button type="submit">Calculate Fare</button>

    </form>

    <div class="result-box" th:if="${calculated}">
        <h2>Fare Result</h2>
        <p>From: <span th:text="${fare.startAddress}"></span></p>
        <p>To: <span th:text="${fare.dropAddress}"></span></p>
        <p>Distance: <span th:text="${fare.km}"></span> km</p>
        <p><strong>Normal Fare: </strong><span th:text="${fare.normalFare}"></span> TK</p>
        <p><strong>Student Fare: </strong><span th:text="${fare.studentFare}"></span> TK</p>
    </div>

    <br>
    <a href="/">Back to Dashboard</a>
    <a href="/history">View History</a>
</div>

</body>
</html>
