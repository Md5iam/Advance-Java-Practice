<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Product List</title>
</head>

<body>


<h1>Product List</h1>


<a th:href="@{/product/add}">
    Add Product
</a>


<br><br>


<p th:if="${productList.isEmpty()}">
    No Product Available
</p>


<table border="1" th:unless="${productList.isEmpty()}">

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Category</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Action</th>
    </tr>


    <tr th:each="it : ${productList}">

        <td th:text="${it.id}"></td>

        <td th:text="${it.name}"></td>

        <td th:text="${it.category}"></td>

        <td th:text="${it.price}"></td>

        <td th:text="${it.stock}"></td>


        <td>

            <a th:href="@{'/product/edit/' + ${it.id}}"
               style="padding-right:10px">
                Edit
            </a>


            <a th:href="@{'/product/delete/' + ${it.id}}">
                Delete
            </a>

        </td>

    </tr>


</table>


<br><br>


<a th:href="@{/product/add}">
    Back to Add
</a>


</body>

</html>
